backend:
  name: github
  repo: GOgo8Go/avhAstro-Theme          # 替换成你的真实用户名/仓库名
  branch: main
  site_domain: https://avhastro-theme.pages.dev
  base_url: https://avhastro-theme.pages.dev
  auth_endpoint: /api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    slug: "{{fields.filename}}"          # 文件名仍由这个字段决定
    fields:
      - {label: "文件名（不带.md）", name: "filename", widget: "string", required: true}
      - {label: "标题", name: "title", widget: "string", required: true}
      - {label: "分类", name: "categories", widget: "string", required: true}
      - label: "标签"
        name: "tags"
        widget: "list"
        field: {widget: "string", label: "标签"}
        default: []
      - {label: "ID（用于URL）", name: "id", widget: "string", required: true}
      - {label: "日期", name: "date", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "封面 URL", name: "cover", widget: "string", default: ""}
      - {label: "推荐", name: "recommend", widget: "boolean", default: false}
      - {label: "置顶", name: "top", widget: "boolean", default: false}
      - {label: "正文", name: "body", widget: "markdown", required: true}
